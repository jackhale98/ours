name: Create Worker secrets

# Run by hand (Actions → Create Worker secrets → Run workflow) after the API's
# first deploy. Makes the secrets that are just random values, and stores them
# straight in Cloudflare: they are never printed, logged or committed, so
# nobody (you included) ever needs to see them. The secrets you get from
# other services (EMAIL_API_KEY, TURNSTILE_SECRET) go in through the
# Cloudflare dashboard instead; see docs/SELF_HOSTING.md.

on:
  workflow_dispatch:
    inputs:
      rate_limit_salt:
        description: Create RATE_LIMIT_SALT (a random value for hashing rate-limit keys)
        type: boolean
        default: true
      notification_keys:
        description: Create the notification key pair (a new pair turns notifications off on every device until each person turns them on again)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Store RATE_LIMIT_SALT
        if: inputs.rate_limit_salt
        working-directory: apps/api
        run: |
          salt="$(openssl rand -base64 32)"
          echo "::add-mask::$salt"
          printf '%s' "$salt" | pnpm exec wrangler secret put RATE_LIMIT_SALT --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Store the notification key pair
        if: inputs.notification_keys
        working-directory: apps/api
        run: |
          pair="$(node -e '(async()=>{const k=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign"]);const pub=Buffer.from(await crypto.subtle.exportKey("raw",k.publicKey)).toString("base64url");const priv=(await crypto.subtle.exportKey("jwk",k.privateKey)).d;console.log(pub+" "+priv)})()')"
          public="${pair% *}"
          private="${pair#* }"
          echo "::add-mask::$private"
          printf '%s' "$private" | pnpm exec wrangler secret put VAPID_PRIVATE_KEY --env production
          printf '%s' "$public" | pnpm exec wrangler secret put VAPID_PUBLIC_KEY --env production
          echo "Notification public key (not secret): $public" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
